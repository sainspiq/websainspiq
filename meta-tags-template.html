<!-- ============================================================
     META TAGS TEMPLATE - COPY & PASTE KE SETIAP HALAMAN HTML
     ============================================================
     
     INSTRUKSI:
     1. Copy seluruh section <head> ini ke halaman kamu
     2. Ganti VALUE yang ada di dalam kurung [ ] sesuai halaman
     3. Setiap halaman harus punya canonical tag yang UNIK
     4. Social media sharing akan otomatis dengan OG tags
     
     CONTOH PENGGUNAAN UNTUK HALAMAN BERBEDA:
     
     🔹 program.html:
        <title>Program Les Privat - PAUD, SD, SMP, SMA, UTBK | Sainspiq</title>
        <meta property="og:url" content="https://www.sainspiq.com/program.html">
        <meta property="og:title" content="Program Les Privat Sainspiq">
        <link rel="canonical" href="https://www.sainspiq.com/program.html">
     
     🔹 biaya-les.html:
        <title>Biaya Les Privat Sainspiq - Paket Harga Terjangkau</title>
        <meta property="og:url" content="https://www.sainspiq.com/biaya-les.html">
        <link rel="canonical" href="https://www.sainspiq.com/biaya-les.html">
     
     🔹 tentang-kami.html:
        <title>Tentang Sainspiq - Layanan Les Privat Terpercaya</title>
        <meta property="og:url" content="https://www.sainspiq.com/tentang-kami.html">
        <link rel="canonical" href="https://www.sainspiq.com/tentang-kami.html">
        
     ============================================================ -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ✅ GANTI INI: Title yang unik untuk setiap halaman -->
    <title>[JUDUL HALAMAN] | Sainspiq - Les Privat Terbaik Indonesia</title>
    
    <!-- ✅ GANTI INI: Description yang relevan dengan isi halaman (max 160 karakter) -->
    <meta name="description" content="[DESKRIPSI SINGKAT TENTANG HALAMAN INI]">
    
    <!-- ✅ GANTI INI: Keyword yang relevan untuk halaman ini -->
    <meta name="keywords" content="[KEYWORD1], [KEYWORD2], [KEYWORD3], les privat, sainspiq">
    
    <!-- ✅ CANONICAL - WAJIB UNIK per halaman! -->
    <link rel="canonical" href="https://www.sainspiq.com/[NAMA-HALAMAN].html">
    
    <!-- ============================================================
         OPEN GRAPH TAGS (untuk share di Facebook, LinkedIn, dll)
         ============================================================ -->
    <meta property="og:title" content="[JUDUL UNTUK SOCIAL MEDIA]">
    <meta property="og:description" content="[DESKRIPSI SINGKAT UNTUK SOCIAL MEDIA]">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.sainspiq.com/[NAMA-HALAMAN].html">
    <meta property="og:image" content="https://www.sainspiq.com/logo.webp">
    <meta property="og:site_name" content="Sainspiq">
    <meta property="og:locale" content="id_ID">
    
    <!-- ============================================================
         TWITTER CARD TAGS (untuk share di Twitter/X)
         ============================================================ -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="[JUDUL UNTUK TWITTER]">
    <meta name="twitter:description" content="[DESKRIPSI UNTUK TWITTER]">
    <meta name="twitter:image" content="https://www.sainspiq.com/logo.webp">
    
    <!-- ============================================================
         FAVICON & APP ICONS
         ============================================================ -->
    <link rel="icon" type="image/webp" href="logo.webp">
    <link rel="apple-touch-icon" href="logo.webp">
    
    <!-- ============================================================
         PRELOAD ASET PENTING (untuk Core Web Vitals)
         ============================================================ -->
    <link rel="preload" as="image" href="logo.webp" fetchpriority="high">
    
    <!-- ============================================================
         SCHEMA MARKUP (untuk Rich Snippets di Google)
         ============================================================ 
         
         🔹 Untuk halaman PROGRAM: gunakan Service + BreadcrumbList
         🔹 Untuk halaman TENTANG: gunakan Organization + BreadcrumbList
         🔹 Untuk halaman BLOG: gunakan Article + BreadcrumbList
         
         Contoh struktur breadcrumb untuk halaman program.html:
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Beranda",
          "item": "https://www.sainspiq.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "[NAMA HALAMAN]",
          "item": "https://www.sainspiq.com/[NAMA-HALAMAN].html"
        }
      ]
    }
    </script>
    
    <!-- ============================================================
         STYLESHEET & FONTS
         ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Allura&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Allura&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Allura&display=swap"></noscript>
    
    <!-- ============================================================
         LUCIDE ICONS & STYLES
         ============================================================ -->
    <script src="https://unpkg.com/lucide@0.469.0" defer></script>
    <link rel="stylesheet" href="styles.css">
    
</head>
