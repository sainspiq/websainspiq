<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Poster SainsPIQ</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#43266e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio Poster">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--ungu:#43266e;--kuning:#fbd323;--bg:#efeaf7;--teks:#2a1748}
@media (prefers-color-scheme:dark){:root{--bg:#1d1130;--teks:#f1eafb}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--teks);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
p.s{margin:0 0 12px;font-size:14px;opacity:.8}
canvas#c{width:100%;height:auto;display:block;border-radius:12px;touch-action:none;box-shadow:0 4px 18px rgba(0,0,0,.25);cursor:grab}
.panel{display:grid;gap:12px;margin-top:14px}
.box{background:rgba(127,90,200,.12);border-radius:12px;padding:12px}
.box h2{font-size:15px;margin:0 0 8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
button[aria-pressed]{background:rgba(127,90,200,.2);color:var(--teks)}
button[aria-pressed=true]{background:var(--ungu);color:#fff;box-shadow:inset 0 -4px 0 var(--kuning)}
.carbadge{display:flex;align-items:center;gap:10px;width:100%;background:repeating-linear-gradient(135deg,var(--ungu),var(--ungu) 10px,#3a2160 10px,#3a2160 20px);color:#fff;border:2px dashed var(--kuning);border-radius:14px;padding:12px 14px;margin:2px 0 12px;font:inherit;text-align:left;cursor:pointer}
.carbadge .ic{font-size:24px;flex:none;line-height:1}
.carbadge .tx{flex:1;min-width:0}
.carbadge .tx b{display:block;font-size:15px;font-weight:800}
.carbadge .tx span{display:block;font-size:12px;font-weight:600;opacity:.85;margin-top:1px}
.carbadge[aria-pressed=true]{background:var(--kuning);color:var(--ungu);border-style:solid;border-color:var(--ungu);box-shadow:inset 0 -4px 0 var(--ungu)}
.gal{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px}
.gal button{flex:0 0 auto;width:112px;padding:6px;display:grid;gap:5px;font-size:12px;text-align:center}
.gal canvas{width:100%;height:auto;border-radius:6px;display:block}
label.btn,button{background:var(--ungu);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
label.btn:focus-within,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--kuning);outline-offset:2px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
input[type=range]{flex:1;min-width:120px}
input[type=text],textarea,select{width:100%;padding:10px;border-radius:10px;border:1px solid #8a6fbb;font:inherit;background:#fff;color:#222}
input[type=color]{width:56px;height:40px;border:0;padding:0;background:none}
textarea{min-height:76px;resize:vertical}
.fields{display:grid;gap:8px;margin-top:10px}
.fields label{font-size:12px;opacity:.85;display:grid;gap:3px}
summary{font-weight:800;font-size:15px;cursor:pointer}
button.dl{background:var(--kuning);color:var(--ungu);font-size:16px;padding:14px;width:100%}
button.sec{background:rgba(127,90,200,.25);color:var(--teks)}
button.sw[aria-pressed]{width:44px;height:44px;padding:0;border-radius:50%;border:3px solid rgba(127,90,200,.35);box-shadow:none;flex:none}
button.sw[aria-pressed=true]{border-color:var(--teks);box-shadow:0 0 0 3px var(--kuning)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
button:disabled{opacity:.45;cursor:default}
.opts button{padding:8px 12px;font-size:13px}
.zl{font-size:13px}
.fields label.chk{display:flex;align-items:center;gap:8px;font-size:14px;opacity:1}
.dr{display:flex;gap:10px;align-items:center;background:rgba(127,90,200,.12);border-radius:10px;padding:8px}
.dr img{width:48px;border-radius:6px;flex:none}
.dr .t{flex:1;min-width:0;font-size:12px;opacity:.9}
.dr .t b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr .b{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dr button{padding:7px 10px;font-size:13px}
.pwa-install{display:none;align-items:center;gap:10px;width:100%;margin:0 0 12px;background:var(--kuning);color:var(--ungu);box-shadow:inset 0 -4px 0 var(--ungu);font-size:15px;text-align:left}
.pwa-install.show{display:flex}
.pwa-install .ic{font-size:22px;line-height:1;flex:none}
.pwa-install small{display:block;font-size:12px;font-weight:600;opacity:.85}
.pwa-hint{display:none;background:rgba(127,90,200,.18);border-radius:12px;padding:10px 12px;margin:-4px 0 12px;font-size:13px;line-height:1.5}
.pwa-hint.show{display:block}
@media (display-mode:standalone){.pwa-install,.pwa-hint{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Studio Poster SainsPIQ</h1>
  <p class="s">Pilih template dan ukuran, atur brand kit, ganti foto, lalu unduh.</p>
  <button type="button" class="pwa-install" id="pwaInstall" hidden>
    <span class="ic">📲</span>
    <span><b>Pasang aplikasi</b><small>Buka dari layar utama, bisa offline</small></span>
  </button>
  <div class="pwa-hint" id="pwaHint" role="note"></div>
  <button type="button" class="carbadge" id="carBadge" aria-pressed="false">
    <span class="ic">📑</span>
    <span class="tx"><b>Carousel</b><span>Poster multi-slide, terpisah dari template lain</span></span>
  </button>
  <div class="gal" id="gal" role="group" aria-label="Galeri template"></div>
  <button type="button" class="sec" id="newTpl" style="width:100%;margin:-2px 0 12px">➕ Buat template sendiri (unggah desain)</button>
  <div class="seg two" id="thm" role="group" aria-label="Tema"></div>
  <div class="seg" id="seg" role="group" aria-label="Ukuran poster"></div>
  <canvas id="c" width="1122" height="1402" tabindex="0" aria-label="Pratinjau poster. Untuk carousel, geser kiri atau kanan, atau pakai tombol panah, untuk pindah slide."></canvas>
  <div class="panel">
    <div class="box" id="box0"><h2>Foto pertama</h2>
      <div class="row"><label class="btn">Ganti foto<input type="file" accept="image/*" data-slot="0"></label>
      <span class="zl">Zoom</span><input type="range" min="1" max="3" step="0.01" value="1" data-zoom="0" aria-label="Zoom foto pertama"></div></div>
    <div class="box" id="box1"><h2>Foto kedua</h2>
      <div class="row"><label class="btn">Ganti foto<input type="file" accept="image/*" data-slot="1"></label>
      <span class="zl">Zoom</span><input type="range" min="1" max="3" step="0.01" value="1" data-zoom="1" aria-label="Zoom foto kedua"></div></div>
    <details class="box" open><summary>Isi template</summary><div class="fields" id="fields"></div></details>
    <details class="box"><summary>Draft &amp; riwayat</summary><div class="fields" id="drafts"></div></details>
    <details class="box"><summary>Brand kit (berlaku di semua template)</summary><div class="fields" id="brand"></div></details>
    <button class="dl" id="dl">Unduh PNG</button>
  </div>
</div>
<script>
const cv=document.getElementById('c');let x=cv.getContext('2d');
const W=1122;let P,P2,Y,FONT,LIGHT=false,TX,TX2,ACT,ACT2,PB,PF,PB2,PF2,CARD,theme='dark';try{theme=localStorage.getItem('sq_theme')||'dark'}catch(e){}
const LAY={
 feed:{name:'Feed 4:5',H:1402,hs:1,hdy:75,h1:398,h1s:92,h2:486,h2s:76,ph:[[90,541,452,430],[574,541,452,430]],ly:1034,lg:46,lf:25,py:1197,pH:114},
 story:{name:'Story 9:16',H:1995,hs:1,hdy:165,h1:560,h1s:92,h2:648,h2s:76,ph:[[111,700,900,430],[111,1160,900,430]],ly:1665,lg:46,lf:25,py:1830,pH:114},
 sq:{name:'Persegi 1:1',H:1122,hs:.7,hdy:28,h1:250,h1s:68,h2:315,h2s:56,ph:[[90,350,452,330],[574,350,452,330]],ly:745,lg:42,lf:23,py:915,pH:110}
};
const FONTS={rounded:['Bulat','"Nunito","Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif'],sans:['Sans-serif','"Helvetica Neue",Arial,system-ui,sans-serif'],serif:['Serif','Georgia,"Times New Roman",serif'],tegas:['Tegas','Impact,"Arial Black","Franklin Gothic Heavy",sans-serif']};
const DEF={p:'#43266e',a:'#fbd323',font:'rounded',name1:'Sains',name2:'PIQ',sub:'Kidz',tag:'Belajar Menyenangkan, Prestasi Meningkat',phone:'0851 8807 2997',logo:''};
let B={...DEF};try{Object.assign(B,JSON.parse(localStorage.getItem('sq_brand')||'{}'))}catch(e){}
const saveB=()=>{try{localStorage.setItem('sq_brand',JSON.stringify(B))}catch(e){}};
let logoImg=null;
function setLogo(src){if(!src){logoImg=null;draw();return}const im=new Image();im.onload=()=>{logoImg=im;draw()};im.src=src}

/* ---------- helper gambar ---------- */
function mix(h,t,f){const g=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const a=g(h),b=g(t);return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*f).toString(16).padStart(2,'0')).join('')}
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function fit(t,size,maxW,wt=900){x.font=`${wt} ${size}px ${FONT}`;while(x.measureText(t).width>maxW&&size>16){size-=2;x.font=`${wt} ${size}px ${FONT}`}return size}
function wrap(t,size,wt,maxW){x.font=`${wt} ${size}px ${FONT}`;const out=[];String(t).split('\n').forEach(p=>{let line='';p.split(' ').forEach(w=>{const s=line?line+' '+w:w;if(x.measureText(s).width>maxW&&line){out.push(line);line=w}else line=s});out.push(line)});return out}
function fitWrap(t,max,min,wt,maxW,maxH,lh){let s=max,l;for(;s>=min;s-=2){l=wrap(t,s,wt,maxW);if(l.length*s*lh<=maxH)break}if(s<min){s=min;l=wrap(t,s,wt,maxW)}return{s,l,lh}}
function lines(q,cx,y,align='center'){x.font=`${q.wt} ${q.s}px ${FONT}`;x.textAlign=align;q.l.forEach(l=>{x.fillText(l,cx,y+q.s);y+=q.s*q.lh});return y}
function pillText(t,size,maxW,cx,y,h,bg,fg,wt){const s=fit(t,size,maxW,wt);const w=x.measureText(t).width+h*1.1;x.fillStyle=bg;rr(cx-w/2,y,w,h,h/2);x.fill();x.fillStyle=fg;x.textAlign='center';x.fillText(t,cx,y+h/2+s*.35)}
function sparkle(cx,cy,r){x.beginPath();x.moveTo(cx,cy-r);x.quadraticCurveTo(cx,cy,cx+r,cy);x.quadraticCurveTo(cx,cy,cx,cy+r);x.quadraticCurveTo(cx,cy,cx-r,cy);x.quadraticCurveTo(cx,cy,cx,cy-r);x.fill()}
function dots(a,b){x.fillStyle=LIGHT?mix(P,'#ffffff',.82):'rgba(255,255,255,.25)';for(let i=0;i<4;i++)for(let j=0;j<3;j++){x.beginPath();x.arc(a+i*30,b+j*30,9,0,7);x.fill()}}
function star(cx,cy,R,r){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,d=i%2?r:R;x.lineTo(cx+Math.cos(a)*d,cy+Math.sin(a)*d)}x.closePath()}
function check(cx,cy){x.strokeStyle=LIGHT?P:Y;x.lineWidth=3;x.beginPath();x.arc(cx,cy,14,0,7);x.stroke();x.beginPath();x.moveTo(cx-6,cy);x.lineTo(cx-1,cy+5);x.lineTo(cx+7,cy-5);x.stroke()}
function photo(f,s){
  x.fillStyle=Y;rr(f.x,f.y+8,f.w,f.h,40);x.fill();
  x.fillStyle=LIGHT?P:'#fff';rr(f.x,f.y,f.w,f.h,40);x.fill();
  const b=6,iwF=f.w-2*b,ihF=f.h-2*b;x.save();rr(f.x+b,f.y+b,iwF,ihF,34);x.clip();
  x.fillStyle='#ddd';x.fillRect(f.x,f.y,f.w,f.h);
  if(s.img){
    const iw=s.img.width,ih=s.img.height,sc=Math.max(iwF/iw,ihF/ih)*s.zoom,dw=iw*sc,dh=ih*sc;
    const mx=(dw-iwF)/2,my=(dh-ihF)/2;
    s.ox=Math.max(-mx,Math.min(mx,s.ox));s.oy=Math.max(-my,Math.min(my,s.oy));
    x.drawImage(s.img,f.x+b+(iwF-dw)/2+s.ox,f.y+b+(ihF-dh)/2+s.oy,dw,dh);
  }
  x.restore();
}
const region=L=>{const a=L.hdy+215*L.hs+30,b=L.py-30;return{a,b,R:b-a}};

/* ---------- bagian bersama ---------- */
function bg(L){
  x.fillStyle=LIGHT?'#fff':P;x.fillRect(0,0,W,L.H);dots(75,65);
  x.strokeStyle=LIGHT?mix(P,'#ffffff',.82):'rgba(255,255,255,.18)';x.lineWidth=3;
  [130,190,245].forEach(r=>{x.beginPath();x.arc(W,-10,r,0,7);x.stroke()});
  [60,100,150].forEach(r=>{x.beginPath();x.arc(-10,L.H-72,r,0,7);x.stroke()});
}
function bgPlain(L){
  x.fillStyle=LIGHT?'#fff':P;x.fillRect(0,0,W,L.H);
  x.fillStyle=LIGHT?P:Y;x.fillRect(0,0,W,12);
  x.fillStyle=LIGHT?P:Y;x.fillRect(0,L.H-12,W,12);
}
function header(L,noTag){
  x.save();x.translate(561*(1-L.hs),L.hdy-75*L.hs);x.scale(L.hs,L.hs);
  if(logoImg){
    const r=Math.min(520/logoImg.width,110/logoImg.height),w=logoImg.width*r,h=logoImg.height*r;
    x.drawImage(logoImg,561-w/2,75+(110-h)/2,w,h);
  }else{
    const nm=B.name1+B.name2,ns=fit(nm,92,470),tw=x.measureText(nm).width,w1=x.measureText(B.name1).width;
    const gx=561-(140+tw)/2,sx=gx+63;
    x.save();x.translate(sx-375,0);
    x.fillStyle=Y;x.strokeStyle=Y;x.lineWidth=22;star(375,143,52,28);x.fill();x.stroke();
    x.fillStyle=P;[[358,130],[394,130]].forEach(([a,b])=>{x.beginPath();x.ellipse(a,b,6,8,0,0,7);x.fill()});
    x.strokeStyle=P;x.lineWidth=4;x.beginPath();x.arc(376,148,11,0.15*Math.PI,0.85*Math.PI);x.stroke();
    x.fillStyle='rgba(255,110,110,.7)';[[346,150],[406,150]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,8,0,7);x.fill()});
    x.restore();
    x.font=`900 ${ns}px ${FONT}`;x.textAlign='left';x.fillStyle=LIGHT?P:'#fff';x.fillText(B.name1,gx+140,168);
    x.fillStyle=LIGHT?mix(P,'#ffffff',.3):Y;x.fillText(B.name2,gx+140+w1,168);
  }
  if(B.sub)pillText(B.sub,29,300,561,186,44,LIGHT?P:P2,'#fff',800);
  if(!noTag){x.fillStyle=LIGHT?P:'#fff';x.textAlign='center';fit(B.tag,27,640,600);x.fillText(B.tag,561,278);
  const tw=x.measureText(B.tag).width/2;x.strokeStyle=LIGHT?P:'#fff';x.lineWidth=3;
  [[-tw-57,-tw-13],[tw+13,tw+57]].forEach(([a,b])=>{x.beginPath();x.moveTo(561+a,269);x.lineTo(561+b,269);x.stroke()})}
  x.restore();
}
function phonePill(L){
  const k=L.pH/114,cy=L.py+L.pH/2;
  x.fillStyle=LIGHT?P:'#fff';rr(256,L.py,592,L.pH,L.pH/2);x.fill();
  x.fillStyle=LIGHT?Y:P;x.beginPath();x.arc(317,cy,38*k,0,7);x.fill();
  x.strokeStyle=LIGHT?P:Y;x.lineWidth=11*k;x.beginPath();x.arc(322,cy-5*k,15*k,0.95*Math.PI,1.95*Math.PI,true);x.stroke();
  x.fillStyle=LIGHT?'#fff':P;x.textAlign='left';fit(B.phone,62*k,440,900);x.fillText(B.phone,385,cy+20*k);
  x.strokeStyle=LIGHT?P2:Y;x.lineWidth=6;
  [[828,-25,834,-13],[843,-29,850,-13],[858,-21,866,-7]].forEach(([a,b,c,d])=>{x.beginPath();x.moveTo(a,L.py+b);x.lineTo(c,L.py+d);x.stroke()});
}
function wave(L){const H=L.H;x.fillStyle=LIGHT?mix(P,'#ffffff',.88):P2;x.beginPath();x.moveTo(0,H-57);x.bezierCurveTo(250,H-102,420,H-12,650,H-52);x.bezierCurveTo(850,H-87,1000,H-72,W,H-92);x.lineTo(W,H);x.lineTo(0,H);x.fill()}

/* ---------- template ---------- */
function tPromo(L,t){
  x.textAlign='center';x.fillStyle=LIGHT?P:'#fff';fit(t.h1,L.h1s,915);x.fillText(t.h1,561,L.h1);
  if(LIGHT){pillText(t.h2,L.h2s*.85,800,561,L.h2-L.h2s*.98,L.h2s*1.3,P,Y,900)}else{x.fillStyle=Y;fit(t.h2,L.h2s,780);x.fillText(t.h2,561,L.h2)}
  x.fillStyle=LIGHT?P2:'#fff';sparkle(1027,L.h2+7,20);sparkle(48,L.ph[0][1]+285*(L.ph[0][3]/430),10);
  const fr=L.ph.map(([a,b,c,d])=>({x:a,y:b,w:c,h:d}));photo(fr[0],slots[0]);photo(fr[1],slots[1]);
  x.textAlign='left';
  for(let r=0;r<3;r++){const y=L.ly+r*L.lg;
    [[108,133,t['i'+r]],[594,619,t['i'+(r+3)]]].forEach(([cx,tx,s])=>{check(cx,y);x.fillStyle=LIGHT?P:'#fff';fit(s,L.lf,405,600);x.fillText(s,tx,y+9)})}
  return fr;
}
function tTesti(L,t){
  const{a,b,R}=region(L),ts=Math.min(68,R*.08);
  x.textAlign='center';x.fillStyle=ACT;fit(t.title,ts,900);x.fillText(t.title,561,a+ts);
  const fh=Math.min(R*.32,440),fw=Math.min(fh*1.35,700),fy=a+ts+35,f={x:(W-fw)/2,y:fy,w:fw,h:fh};photo(f,slots[0]);
  const cy=fy+fh+45,ch=b-cy,availH=ch-30-105;
  card(90,cy,942,ch,36);
  const q=fitWrap('“'+t.quote+'”',46,22,700,840,availH,1.3);q.wt=700;
  x.fillStyle=P;lines(q,561,cy+30+(availH-q.l.length*q.s*q.lh)/2);
  x.textAlign='center';x.fillStyle=P;fit(t.name,36,840,900);x.fillText(t.name,561,cy+ch-58);
  x.fillStyle=P2;fit(t.info,25,840,600);x.fillText(t.info,561,cy+ch-22);
  return [f];
}
function tJadwal(L,t){
  const{a,b}=region(L);x.textAlign='center';
  x.fillStyle=ACT;fit(t.title,64,915);x.fillText(t.title,561,a+60);
  x.fillStyle=TX;fit(t.sub,34,900,600);x.fillText(t.sub,561,a+112);
  const rows=[0,1,2,3,4,5].map(i=>t['r'+i]).filter(s=>s&&s.trim());
  if(!rows.length)return[];
  const top=a+150,rh=Math.min(112,(b-top)/rows.length-14),fs=Math.min(36,rh*.42);
  rows.forEach((s,i)=>{
    const[d,tm,m]=s.split('|').map(v=>v.trim()),y=top+i*(rh+14),ty=y+rh/2+fs*.35;
    card(90,y,942,rh,rh/2.6);
    x.textAlign='left';
    x.fillStyle=P;fit(d||'',fs,190,900);x.fillText(d||'',125,ty);
    x.fillStyle=P2;fit(tm||'',fs,170,700);x.fillText(tm||'',335,ty);
    x.fillRect(505,y+rh*.2,4,rh*.6);
    x.fillStyle=P;fit(m||'',fs,470,800);x.fillText(m||'',535,ty);
  });
  return [];
}
function tInfo(L,t){
  const{a,R}=region(L);
  const tt=fitWrap(t.title,110,44,900,900,R*.34,1.1);tt.wt=900;
  const bd=fitWrap(t.body,40,22,600,880,R*.3,1.4);bd.wt=600;
  const total=60+40+tt.l.length*tt.s*tt.lh+40+bd.l.length*bd.s*bd.lh+50+70;
  let y=a+Math.max(0,(R-total)/2);
  pillText(t.badge,32,500,561,y,60,PB,PF,900);y+=100;
  x.fillStyle=TX;y=lines(tt,561,y)+40;
  x.fillStyle=TX2;y=lines(bd,561,y)+50;
  pillText(t.date,34,860,561,y,70,PB2,PF2,800);
  return [];
}

function tGuru(L,t){

function luma(h){const g=i=>parseInt(h.slice(i,i+2),16);return(.299*g(1)+.587*g(3)+.114*g(5))/255}
function carCols(t){
  const k=(t&&t.bgc)||'brand';

  if(k==='custom'){

  const q=CAR_PAL.find(o=>o.k===k)||CAR_PAL[0];

function parseSlides(txt){
  const strip=l=>l.replace(/\*\*|__|`/g,'').replace(/^\s*#{1,6}\s*/,'').trim();
  const lab=l=>l.replace(/^(judul|title|headline|isi|teks|konten|caption)\s*:\s*/i,'').trim();
  const head=/^(?:[>*\-\s]*)(?:slide|halaman|hal\.?|gambar)\s*\d+\s*[:.\-–—)]*\s*(.*)$/i;
  const raw=String(txt).replace(/\r/g,'').split('\n').map(strip),hm=raw.some(l=>head.test(l));
  const blocks=[];let cur=null;
  raw.forEach(l=>{
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(l)||(!l&&!hm)){cur=null;return}
    const m=hm&&head.exec(l);
    if(m){cur=[];blocks.push(cur);if(m[1].trim())cur.push(m[1].trim());return}
    if(!l)return;
    if(!cur){cur=[];blocks.push(cur)}
    cur.push(l);
  });
  return blocks.map(b=>b.map(lab).filter(Boolean)).filter(b=>b.length).slice(0,12).map(b=>({
    title:b[0].replace(/[:：]$/,''),
    body:b.slice(1).map(l=>l.replace(/^[-*•]\s+/,'• ')).join('\n')}));
}

function crc32(u){let c=-1;for(let i=0;i<u.length;i++){c^=u[i];for(let k=0;k<8;k++)c=(c>>>1)^(0xEDB88320&-(c&1))}return(c^-1)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cen=[],u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];let off=0;
  files.forEach(f=>{
    const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0),...u16(0),...u16(0),...u16(33),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
    cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(33),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    parts.push(lh,nm,f.data);off+=lh.length+nm.length+sz;
  });
  const cs=cen.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
  return new Blob([...parts,...cen,end],{type:'application/zip'});
}
async function exportZip(btn){
  const c=T.carousel,keepIdx=c.idx,keepX=x,off=document.createElement('canvas'),files=[];
  btn.disabled=true;
  try{for(let i=0;i<c.slides.length;i++){c.idx=i;x=off.getContext('2d');paint('carousel',fmt);
    const b=await new Promise(r=>off.toBlob(r,'image/png'));
    files.push({name:`sainspiq-carousel-${String(i+1).padStart(2,'0')}.png`,data:new Uint8Array(await b.arrayBuffer())})}}
  finally{c.idx=keepIdx;x=keepX;btn.disabled=false;draw()}
  const a=document.createElement('a');a.href=URL.createObjectURL(makeZip(files));a.download='sainspiq-carousel.zip';a.click();
}

function makeThumb(){const c=document.createElement('canvas');c.width=180;c.height=Math.round(180*cv.height/cv.width);c.getContext('2d').drawImage(cv,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}
function autosave(){LS.set('sq_auto',{tpl,fmt,T,photos:[getPh(0),getPh(1)]})}
function syncUI(){[...gal.children].forEach((b,i)=>b.setAttribute('aria-pressed',GAL_KEYS[i]===tpl));[...seg.children].forEach((b,i)=>b.setAttribute('aria-pressed',Object.keys(LAY)[i]===fmt));carBadge.setAttribute('aria-pressed',tpl==='carousel');[...seg.children].forEach(b=>b.disabled=!!(TPL[tpl]&&TPL[tpl].custom));document.getElementById('newTpl').disabled=!!edState}
function applyState(st){
  if(st.T)Object.keys(st.T).forEach(k=>{if(T[k])Object.assign(T[k],st.T[k])});
  if(TPL[st.tpl])tpl=st.tpl;if(LAY[st.fmt])fmt=st.fmt;
  syncUI();[0,1].forEach(i=>{const p=st.photos&&st.photos[i];if(p)load(i,p.src,p)});buildFields();draw();
}
let curId=null,dname='';
const fmtTime=t=>new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function saveDraft(update){
  const list=LS.get('sq_drafts',[]);
  const snap={tpl,fmt,T:{[tpl]:{...T[tpl]}},photos:[0,1].map(i=>TPL[tpl].photos>i?getPh(i):null),thumb:makeThumb()};
  const name=(dname||'').trim()||`${TPL[tpl].name} ${new Date().toLocaleDateString('id-ID')}`;
  const i=update&&curId?list.findIndex(d=>d.id===curId):-1;
  if(i>=0)list[i]={...list[i],...snap,name,time:Date.now()};
  else{curId='d'+Date.now();list.unshift({id:curId,name,time:Date.now(),...snap})}
  if(!LS.set('sq_drafts',list.slice(0,40)))return renderDrafts('Penyimpanan browser penuh. Hapus draft lama atau unduh cadangan dulu.');
  dname=name;renderDrafts(i>=0?'Draft diperbarui.':'Draft tersimpan.');
}
function mkBtn(t,fn,cls){const b=document.createElement('button');b.type='button';b.textContent=t;if(cls)b.className=cls;b.onclick=fn;return b}
function renderDrafts(msg){
  const box=document.getElementById('drafts');box.innerHTML='';
  const nm=document.createElement('input');nm.type='text';nm.value=dname;nm.placeholder='Contoh: Profil Kak Aisyah Semarang';nm.oninput=()=>dname=nm.value;
  box.append(field('Nama draft',nm));
  const r=document.createElement('div');r.className='row';
  r.append(mkBtn('Simpan sebagai baru',()=>saveDraft(false)));
  if(curId)r.append(mkBtn('Perbarui draft ini',()=>saveDraft(true),'sec'));
  r.append(mkBtn('Reset isi ke contoh',()=>{Object.assign(T[tpl],JSON.parse(JSON.stringify(TPL[tpl].d)));buildFields();draw()},'sec'));
  box.append(r);
  const m=document.createElement('div');m.className='zl';m.setAttribute('aria-live','polite');m.textContent=msg||'Isi terakhir Anda tersimpan otomatis di browser ini.';box.append(m);
  const list=LS.get('sq_drafts',[]);
  list.forEach(d=>{
    const it=document.createElement('div');it.className='dr';
    const im=document.createElement('img');im.src=d.thumb||'';im.alt='';
    const t=document.createElement('div');t.className='t';t.innerHTML='<b></b><span></span>';t.firstChild.textContent=d.name;t.lastChild.textContent=`${TPL[d.tpl]?TPL[d.tpl].name:d.tpl} · ${fmtTime(d.time)}`;
    const b=document.createElement('div');b.className='b';
    b.append(mkBtn('Buka',()=>{applyState(d);curId=d.id;dname=d.name;renderDrafts('Draft dibuka.')}));
    b.append(mkBtn('Duplikat',()=>{const l=LS.get('sq_drafts',[]);l.unshift({...d,id:'d'+Date.now(),name:d.name+' (salinan)',time:Date.now()});if(LS.set('sq_drafts',l.slice(0,40)))renderDrafts('Draft diduplikat.');else renderDrafts('Penyimpanan browser penuh.')},'sec'));
    const del=mkBtn('Hapus',()=>{if(del.dataset.ok){LS.set('sq_drafts',LS.get('sq_drafts',[]).filter(o=>o.id!==d.id));if(curId===d.id)curId=null;renderDrafts('Draft dihapus.')}else{del.dataset.ok=1;del.textContent='Yakin hapus?';setTimeout(()=>{del.dataset.ok='';del.textContent='Hapus'},3000)}},'sec');
    b.append(del);it.append(im,t,b);box.append(it);
  });
  const bk=document.createElement('div');bk.className='row';
  bk.append(mkBtn('Unduh cadangan',()=>{const blob=new Blob([JSON.stringify({drafts:LS.get('sq_drafts',[]),brand:B,custom:LS.get('sq_custom',[]),cartpl:LS.get('sq_cartpl',[])})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cadangan-studio-sainspiq.json';a.click()},'sec'));
  const lb=document.createElement('label');lb.className='btn';lb.textContent='Pulihkan cadangan';
  const fi=document.createElement('input');fi.type='file';fi.accept='application/json,.json';
  fi.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{
    const d=JSON.parse(rd.result),cur=LS.get('sq_drafts',[]),ids=new Set(cur.map(o=>o.id));
    const merged=[...cur,...(d.drafts||[]).filter(o=>!ids.has(o.id))].sort((a,b)=>b.time-a.time).slice(0,40);
    LS.set('sq_drafts',merged);if(d.brand){B={...DEF,...d.brand};saveB();buildBrand();setLogo(B.logo)}
    if(d.custom&&d.custom.length){const cc=LS.get('sq_custom',[]),ci=new Set(cc.map(o=>o.id));d.custom.filter(o=>!ci.has(o.id)).forEach(o=>{cc.push(o);regCustom(o)});LS.set('sq_custom',cc);buildGal()}
    if(d.cartpl&&d.cartpl.length){const cp=LS.get('sq_cartpl',[]),pi=new Set(cp.map(o=>o.id));LS.set('sq_cartpl',[...cp,...d.cartpl.filter(o=>!pi.has(o.id))].slice(0,20))}
    renderDrafts('Cadangan dipulihkan.')}catch(err){renderDrafts('File cadangan tidak dapat dibaca.')}};rd.readAsText(f)};
  lb.append(fi);bk.append(lb);box.append(bk);
}
LS.get('sq_custom',[]).forEach(o=>{try{regCustom(o)}catch(e){}});
buildGal();
const AUTO=LS.get('sq_auto',null);
buildFields();buildBrand();if(B.logo)setLogo(B.logo);
if(AUTO)applyState(AUTO);
[0,1].forEach(i=>{if(!(AUTO&&AUTO.photos&&AUTO.photos[i]))load(i,DEFPH[i])});
renderDrafts();draw();

if(document.fonts)document.fonts.ready.then(draw);

/* ---------- PWA: tombol install ---------- */
(function(){
  const btn=document.getElementById('pwaInstall'),hint=document.getElementById('pwaHint');
  const standalone=()=>matchMedia('(display-mode:standalone)').matches||navigator.standalone===true;
  if(standalone())return;
  let dp=null;
  const show=()=>{btn.hidden=false;btn.classList.add('show')};
  const hide=()=>{btn.classList.remove('show');btn.hidden=true;hint.classList.remove('show')};

  if('serviceWorker' in navigator&&location.protocol!=='file:'){
    window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }

  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;show()});
  window.addEventListener('appinstalled',()=>{dp=null;hide()});

  btn.addEventListener('click',async()=>{
    if(dp){
      dp.prompt();
      try{await dp.userChoice}catch(e){}
      dp=null;hide();
      return;
    }
    const ua=navigator.userAgent;
    const ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    hint.innerHTML=ios
      ?'Di iPhone/iPad: ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas) di Safari, lalu pilih <b>Tambah ke Layar Utama</b>.'
      :'Buka menu browser (⋮), lalu pilih <b>Instal aplikasi</b> atau <b>Tambahkan ke layar utama</b>.';
    hint.classList.toggle('show');
  });

  // iOS Safari tidak punya beforeinstallprompt: tampilkan tombol dengan petunjuk manual
  const ua=navigator.userAgent;
  const ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&/safari/i.test(ua)&&!/crios|fxios/i.test(ua))show();
})();
</script>
