    <style>
        /* Geser logo header sedikit ke kiri (custom, tidak bergantung pada utility Tailwind yang belum ter-compile) */
        .logo-link{ margin-left:-14px; }
        @media (min-width:640px){ .logo-link{ margin-left:-20px; } }

        /* Menu desktop: huruf lebih besar (tanpa dipertebal) */

            background-position:center;
            background-repeat:no-repeat;
        }
        .faq-bg-section::before{
            content:"";
            position:absolute; inset:0;
            background:rgba(255,255,255,0.25);
            z-index:1;
        }

        /* Foto dokumentasi: perkecil di tampilan desktop (mobile tetap full width) */
        @media (min-width:768px){
            #dokumentasi .reveal.w-full.rounded-2xl{ max-width:640px; margin-left:auto; margin-right:auto; }
        }

        /* Section Dokumentasi + Testimoni sejajar (khusus desktop, mobile tetap seperti semula) */
        @media (min-width:1024px){
            .doku-testi-row{ display:flex; align-items:stretch; }
            .doku-testi-row #dokumentasi,
            .doku-testi-row #testimoni{
                width:50%;
                flex-shrink:0;
                border-bottom:0;
                padding-top:4rem;
                padding-bottom:4rem;
            }
            .doku-testi-row #dokumentasi{ border-right:1px solid #e2e8f0; }
            .doku-testi-row #dokumentasi .reveal.w-full.rounded-2xl{ max-width:100%; }
            .doku-testi-row #dokumentasi > div,
            .doku-testi-row #testimoni > div{ max-width:100%; }
        }

        /* Mobile: navbar jangan terlalu transparan + geser logo lebih kiri */
        @media (max-width:767px){
            header.glass-nav{ background-color:rgba(255,255,255,0.92) !important; backdrop-filter:blur(10px) !important; -webkit-backdrop-filter:blur(10px) !important; }
            .logo-link{ margin-left:-34px; }
        }

        /* WhatsApp Konsultasi Popup Modal — CSS murni agar selalu tampil benar */
        .wa-modal-overlay{
            position:fixed; inset:0; background:rgba(15,23,42,0.6); backdrop-filter:blur(4px);
            -webkit-backdrop-filter:blur(4px); z-index:9999; display:none;
            align-items:center; justify-content:center; padding:16px;
        }
        .wa-modal-overlay.is-open{ display:flex; }
        .wa-modal-box{
            background:#fff; border-radius:18px; box-shadow:0 25px 60px -12px rgba(0,0,0,0.45);
            width:100%; max-width:460px; padding:28px 24px; position:relative;
            max-height:90vh; overflow-y:auto;
        }
        @media (min-width:768px){ .wa-modal-box{ padding:32px; } }
        .wa-modal-close{
            position:absolute; top:14px; right:14px; width:34px; height:34px;
            display:flex; align-items:center; justify-content:center; border-radius:9999px;
            background:#f1f5f9; color:#475569; border:none; cursor:pointer; transition:background .2s,color .2s;
            z-index:2;
        }
        .wa-modal-close:hover{ background:#e2e8f0; color:#1e293b; }
        .wa-modal-header{ display:flex; align-items:center; gap:12px; margin-bottom:4px; padding-right:40px; }
        .wa-modal-icon{
            width:40px; height:40px; border-radius:9999px; background:rgba(37,211,102,0.12);
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
        }
        .wa-jenjang-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
        @media (min-width:640px){ .wa-jenjang-grid{ grid-template-columns:repeat(4,1fr); } }
        body.wa-modal-open{ overflow:hidden; }

        /* ══════════════════════════════════════════════════════
           PROGRAM CARDS v3 — Abstract Glassmorphism
           ══════════════════════════════════════════════════════ */
        .pcard-grid{ display:grid; grid-template-columns:1fr; gap:20px; margin-bottom:48px; }
        @media (min-width:640px){ .pcard-grid{ grid-template-columns:repeat(2,1fr); gap:22px; } }
        @media (min-width:1024px){ .pcard-grid{ grid-template-columns:repeat(3,1fr); gap:26px; } }
        @media (min-width:768px){ .pcard-grid{ margin-bottom:64px; } }

        /* CTA Bawah Section Program - fix vertical spacing & centering */
        .pcard-cta-block{
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding-top:16px;
            padding-bottom:48px;
        }
        .pcard-cta-block p{ margin-bottom:0; }
        .pcard-cta-block .pcard-cta-btn{ margin-top:18px; font-size:13px; padding:10px 22px; border-radius:10px; }
        @media (min-width:480px){
            .pcard-cta-block{ padding-top:20px; padding-bottom:56px; }
            .pcard-cta-block .pcard-cta-btn{ margin-top:20px; font-size:14px; padding:11px 26px; }
        }
        @media (min-width:768px){
            .pcard-cta-block{ padding-top:24px; padding-bottom:64px; }
            .pcard-cta-block .pcard-cta-btn{ margin-top:24px; font-size:14px; padding:12px 28px; }
        }

        /* Base Card Container */
        .pcard{
            position:relative; display:block; border-radius:24px; overflow:hidden;
            isolation:isolate; background:var(--pc-bg, #eff6ff);
            box-shadow:0 10px 30px -10px rgba(15,23,42,.05);
            transition:transform .4s cubic-bezier(.22,.9,.24,1), box-shadow .4s ease;
            border: 1px solid rgba(255,255,255,0.8);
            display: flex; flex-direction: column;
        }
        .pcard:hover{
            transform:translateY(-7px);
            box-shadow:0 26px 50px -18px var(--pc-glow, rgba(37,99,235,.4));
            border-color: rgba(255,255,255,1);
        }

        .pcard-bg-wrap { position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
        
        .pcard-shape {
            position:absolute; filter:blur(40px); border-radius:50%;
            opacity:0.65; transition:all 0.6s cubic-bezier(.22,.9,.24,1);
        }
        .pcard-shape-1 {
            top:-30px; left:-30px; width:170px; height:170px;
            background:var(--pc-c1);
        }
        .pcard-shape-2 {
            bottom:-40px; right:-20px; width:190px; height:190px;
            background:var(--pc-c2);
        }
        .pcard:hover .pcard-shape-1 { transform:scale(1.3) translate(15px, 15px); opacity:0.85; }
        .pcard:hover .pcard-shape-2 { transform:scale(1.2) translate(-15px, -15px); opacity:0.85; }

        .pcard-content {
            position:relative; z-index:10; height:100%; display:flex; flex-direction:column;
            padding:28px;
            background: linear-gradient(135deg, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0.65) 100%);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255,255,255,0.9);
            border-left: 1px solid rgba(255,255,255,0.9);
            border-radius: 24px;
        }

        .pcard-icon{
            width:56px; height:56px; border-radius:18px;
            background:linear-gradient(135deg, var(--pc-c1), var(--pc-c2));
            color:#fff; display:flex; align-items:center; justify-content:center;
            box-shadow:0 10px 20px -6px var(--pc-glow);
            transition:transform .4s ease;
        }
        .pcard:hover .pcard-icon{ transform:scale(1.08) rotate(3deg); }

        .pcard-tag{
            font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
            padding:6px 12px; border-radius:9999px; white-space:nowrap;
            background:rgba(255,255,255,.9); 
            color:var(--pc-c2); border:1px solid rgba(255,255,255,.6);
            box-shadow:0 2px 8px rgba(15,23,42,.04);
        }

        .pcard-title{ transition:color .3s ease; }
        .pcard:hover .pcard-title{ color:var(--pc-c2); }

        .pcard-cta{ display:inline-flex; align-items:center; gap:6px; font-size:.875rem; font-weight:600; color:var(--pc-c2); }
        .pcard-cta svg{ transition:transform .3s ease; }
        .pcard:hover .pcard-cta svg{ transform:translateX(4px); }

        .pcard-blue   { --pc-c1:#3b82f6; --pc-c2:#1d4ed8; --pc-glow:rgba(59,130,246,.4);  --pc-bg:#eff6ff; }
        .pcard-cyan   { --pc-c1:#22d3ee; --pc-c2:#0e7490; --pc-glow:rgba(34,211,238,.4);  --pc-bg:#ecfeff; }
        .pcard-violet { --pc-c1:#a78bfa; --pc-c2:#6d28d9; --pc-glow:rgba(167,139,250,.4); --pc-bg:#f5f3ff; }
        .pcard-indigo { --pc-c1:#818cf8; --pc-c2:#4338ca; --pc-glow:rgba(129,140,248,.4); --pc-bg:#eef2ff; }
        .pcard-amber  { --pc-c1:#fbbf24; --pc-c2:#b45309; --pc-glow:rgba(251,191,36,.45); --pc-bg:#fffbeb; }
        .pcard-sky    { --pc-c1:#38bdf8; --pc-c2:#0369a1; --pc-glow:rgba(56,189,248,.4);  --pc-bg:#f0f9ff; }

        .pcard-featured{ box-shadow:0 12px 30px -10px rgba(251,191,36,.4); }
        .pcard-featured .pcard-content {
            border: 1px solid rgba(251,191,36,.4);
            background: linear-gradient(135deg, rgba(255, 251, 235, 0.92) 0%, rgba(255, 255, 255, 0.7) 100%);
        }
        .pcard-ribbon{
            position:absolute; top:16px; left:-32px; z-index:20;
            transform:rotate(-45deg); width:150px; text-align:center;
            background:linear-gradient(90deg,#f59e0b,#b45309); color:#fff;
            font-size:10px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;
            padding:5px 0; box-shadow:0 4px 12px rgba(180,83,9,.4);
        }
    </style>
</head>
